[workspace]
members = ["crates/core", "crates/desktop", "crates/cli"]
resolver = "2"
[workspace.package]
version = "0.13.1"
edition = "2024"
license = "MIT"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = "0.30"
anyhow = "1"
[profile.dev]
opt-level = 1
debug = 0
incremental = false
codegen-units = 1
[profile.dev.package.manifold-rust]
opt-level = 3

[profile.release]
codegen-units = 1
