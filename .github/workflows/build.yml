name: Native build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev xvfb xdotool
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python scripts/test_packaging.py
      - run: cargo build --release --workspace --locked
      - name: Export multicolor regression fixture
        run: ./target/release/tinkercraft-cli export-3mf examples/multicolor-plate.tinkercraft multicolor-test.3mf
      - name: Verify 3MF package and colors
        run: python scripts/validate_3mf.py multicolor-test.3mf
      - name: Install reference 3MF reader
        if: runner.os == 'Linux'
        run: python -m pip install lib3mf==2.5.0
      - name: Validate with reference reader
        if: runner.os == 'Linux'
        run: python scripts/validate_3mf.py multicolor-test.3mf --reference
      - name: Package native application
        run: python scripts/package.py
      - name: Verify extracted native package
        run: python scripts/verify_all_releases.py
      - name: Linux native window regression
        if: runner.os == 'Linux'
        run: python scripts/native-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: TinkerCraft-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
